name: Build libnode

on:
  workflow_dispatch:
    inputs:
      source_ref:
        description: Exact moluopro/nodejs branch, tag, or commit to build.
        required: false
        default: main
      node_branch:
        description: Node.js branch, tag, or commit to build.
        required: false
        default: v24.x
      build_type:
        description: Build configuration to package.
        required: true
        type: choice
        options:
          - Release
          - Debug
        default: Release

env:
  SOURCE_REPOSITORY: moluopro/nodejs
  SOURCE_REF: ${{ inputs.source_ref || 'main' }}
  NODE_BRANCH: ${{ inputs.node_branch || 'v24.x' }}
  BUILD_TYPE: ${{ inputs.build_type || 'Release' }}
  PACKAGE_ARTIFACT_NAME: ${{ inputs.build_type == 'Debug' && 'libnode-debug' || 'libnode' }}
  DEBUG_INFO: ${{ inputs.build_type == 'Debug' && 'embedded-full-windows-compact-non-windows' || 'stripped' }}
  MACOSX_DEPLOYMENT_TARGET: "10.15"
  IOS_DEPLOYMENT_TARGET: "16.0"
  ANDROID_API: "28"
  ANDROID_NDK_VERSION: "28.2.13676358"
  OHOS_SDK_ROOT: ${{ vars.OHOS_SDK_ROOT }}
  OHOS_NATIVE_HOME: ${{ vars.OHOS_NATIVE_HOME }}
  OHOS_SDK_URL: ${{ vars.OHOS_SDK_URL || 'https://repo.huaweicloud.com/openharmony/os/6.0-Release/L2-SDK-MAC-M1-PUBLIC.tar.gz' }}

run-name: Build libnode ${{ inputs.build_type || 'Release' }}

jobs:
  macos:
    name: macOS
    runs-on: macos-26
    steps:
      - &checkout-source
        name: Checkout source
        uses: actions/checkout@v6
        with:
          repository: ${{ env.SOURCE_REPOSITORY }}
          ref: ${{ env.SOURCE_REF }}
          token: ${{ secrets.MY_KEY || vars.MY_KEY }}
          path: source
          fetch-depth: 1

      - name: Build
        working-directory: source
        run: |
          JOBS="$(sysctl -n hw.ncpu)"
          shell/build-mac.sh \
            --branch "${NODE_BRANCH}" \
            --deployment-target "${MACOSX_DEPLOYMENT_TARGET}" \
            --dest-cpu arm64 \
            --jobs "${JOBS}"

      - name: Test macOS embedding with force-load
        working-directory: source
        run: |
          clang++ \
            -std=c++20 \
            -arch arm64 \
            -mmacosx-version-min="${MACOSX_DEPLOYMENT_TARGET}" \
            test/embed-smoke.cc \
            -I build/macos/arm64/include \
            -Wl,-force_load,"${PWD}/build/macos/arm64/libnode.a" \
            -framework CoreFoundation \
            -framework Security \
            -o "${RUNNER_TEMP}/libnode-embed-smoke"
          "${RUNNER_TEMP}/libnode-embed-smoke"

      - name: Upload macOS package
        uses: actions/upload-artifact@v6
        with:
          name: libnode-macos
          path: source/build/macos
          if-no-files-found: error
          retention-days: 2

  ios:
    name: iOS
    runs-on: macos-26
    steps:
      - *checkout-source

      - name: Build
        working-directory: source
        run: |
          JOBS="$(sysctl -n hw.ncpu)"
          shell/build-ios.sh \
            --branch "${NODE_BRANCH}" \
            --sdk iphoneos \
            --deployment-target "${IOS_DEPLOYMENT_TARGET}" \
            --dest-cpu arm64 \
            --jobs "${JOBS}"

      - name: Upload iOS package
        uses: actions/upload-artifact@v6
        with:
          name: libnode-ios
          path: source/build/ios
          if-no-files-found: error
          retention-days: 2

  android:
    name: Android
    runs-on: macos-26
    steps:
      - *checkout-source

      - name: Install Android NDK
        run: |
          SDKMANAGER="${ANDROID_HOME}/cmdline-tools/latest/bin/sdkmanager"
          if [ ! -x "${SDKMANAGER}" ]; then
            SDKMANAGER="$(command -v sdkmanager)"
          fi
          yes | "${SDKMANAGER}" --licenses
          yes | "${SDKMANAGER}" --install "ndk;${ANDROID_NDK_VERSION}"

      - name: Build
        working-directory: source
        run: |
          JOBS="$(sysctl -n hw.ncpu)"
          shell/build-android.sh \
            --branch "${NODE_BRANCH}" \
            --sdk "${ANDROID_HOME}" \
            --ndk "${ANDROID_HOME}/ndk/${ANDROID_NDK_VERSION}" \
            --api "${ANDROID_API}" \
            --dest-cpu arm64 \
            --jobs "${JOBS}"

      - name: Test Android whole-archive link
        working-directory: source
        run: |
          ANDROID_CXX="$(find \
            "${ANDROID_HOME}/ndk/${ANDROID_NDK_VERSION}/toolchains/llvm/prebuilt" \
            -path "*/bin/aarch64-linux-android${ANDROID_API}-clang++" \
            -type f \
            -print \
            -quit)"
          if [ -z "${ANDROID_CXX}" ] || [ ! -x "${ANDROID_CXX}" ]; then
            echo "Android NDK compiler was not found." >&2
            exit 1
          fi
          printf 'int main(void) { return 0; }\n' |
            "${ANDROID_CXX}" \
              -x c++ - \
              -x none \
              -Wl,--whole-archive \
              "${PWD}/build/android/arm64/libnode.a" \
              -Wl,--no-whole-archive \
              -llog \
              -ldl \
              -lm \
              -pthread \
              -o "${RUNNER_TEMP}/libnode-android-wholearchive"

      - name: Upload Android package
        uses: actions/upload-artifact@v6
        with:
          name: libnode-android
          path: source/build/android
          if-no-files-found: error
          retention-days: 2

  ohos:
    name: HarmonyOS
    if: ${{ inputs.build_type != 'Debug' }}
    runs-on: macos-26
    steps:
      - *checkout-source

      - name: Install HarmonyOS SDK
        run: |
          if [ -n "${OHOS_NATIVE_HOME}" ] && [ -x "${OHOS_NATIVE_HOME}/llvm/bin/aarch64-unknown-linux-ohos-clang" ]; then
            echo "Using configured HarmonyOS Native SDK: ${OHOS_NATIVE_HOME}"
            exit 0
          fi

          SDK_ROOT="${RUNNER_TEMP}/ohos-sdk"
          SDK_ARCHIVE="${RUNNER_TEMP}/ohos-sdk.tar.gz"
          mkdir -p "${SDK_ROOT}"
          curl --fail --location --retry 3 --retry-delay 5 --output "${SDK_ARCHIVE}" "${OHOS_SDK_URL}"
          tar -xzf "${SDK_ARCHIVE}" -C "${SDK_ROOT}"
          while IFS= read -r package_file; do
            package_dir="$(dirname "${package_file}")"
            echo "Extracting HarmonyOS SDK package: ${package_file}"
            unzip -q -o "${package_file}" -d "${package_dir}"
          done < <(find "${SDK_ROOT}" -type f -name '*.zip' | sort)

          CLANG_PATH="$(find "${SDK_ROOT}" -path '*/native/llvm/bin/aarch64-unknown-linux-ohos-clang' -print -quit)"
          if [ -z "${CLANG_PATH}" ]; then
            echo "HarmonyOS Native SDK was not found in downloaded SDK." >&2
            find "${SDK_ROOT}" -maxdepth 7 \( -type d -o -type f \) | sort >&2
            exit 1
          fi

          NATIVE_HOME="$(cd "$(dirname "${CLANG_PATH}")/../.." && pwd)"
          echo "OHOS_NATIVE_HOME=${NATIVE_HOME}" >> "${GITHUB_ENV}"
          echo "Installed HarmonyOS Native SDK: ${NATIVE_HOME}"

      - name: Build
        working-directory: source
        run: |
          JOBS="$(sysctl -n hw.ncpu)"
          shell/build-ohos.sh \
            --branch "${NODE_BRANCH}" \
            --dest-cpu arm64 \
            --jobs "${JOBS}"

      - name: Upload HarmonyOS package
        uses: actions/upload-artifact@v6
        with:
          name: libnode-ohos
          path: source/build/ohos
          if-no-files-found: error
          retention-days: 2

  linux:
    name: Linux
    runs-on: ubuntu-22.04
    steps:
      - *checkout-source

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc-12 g++-12 make python3 python3-pip

      - name: Build
        working-directory: source
        run: |
          JOBS="$(nproc)"
          export CC=gcc-12
          export CXX=g++-12
          shell/build-linux.sh \
            --branch "${NODE_BRANCH}" \
            --dest-cpu x64 \
            --jobs "${JOBS}"

      - name: Test Linux embedding with whole-archive
        working-directory: source
        run: |
          g++-12 \
            -std=c++20 \
            test/embed-smoke.cc \
            -I build/linux/x64/include \
            -Wl,--whole-archive \
            "${PWD}/build/linux/x64/libnode.a" \
            -Wl,--no-whole-archive \
            -ldl \
            -lrt \
            -pthread \
            -o "${RUNNER_TEMP}/libnode-embed-smoke"
          "${RUNNER_TEMP}/libnode-embed-smoke"

      - name: Upload Linux package
        uses: actions/upload-artifact@v6
        with:
          name: libnode-linux
          path: source/build/linux
          if-no-files-found: error
          retention-days: 2

  windows:
    name: Windows
    runs-on: windows-2022
    steps:
      - *checkout-source

      - name: Build
        working-directory: source
        shell: pwsh
        run: |
          $Jobs = [Environment]::ProcessorCount
          ./shell/build-windows.ps1 `
            -Branch "${env:NODE_BRANCH}" `
            -DestCpu x64 `
            -Jobs $Jobs

      - name: Test packaged Windows CMake target
        working-directory: source
        shell: pwsh
        run: |
          $SmokeBuild = Join-Path $env:RUNNER_TEMP "libnode-cmake-smoke"
          $CMakeFile = Join-Path $PWD "build/windows/x64/libnode.cmake"
          cmake `
            -S test/windows-cmake-smoke `
            -B $SmokeBuild `
            -G "Visual Studio 17 2022" `
            -A x64 `
            "-DLIBNODE_CMAKE_FILE=$CMakeFile"
          if ($LASTEXITCODE -ne 0) { throw "CMake configure failed" }
          cmake --build $SmokeBuild --config $env:BUILD_TYPE
          if ($LASTEXITCODE -ne 0) { throw "CMake build failed" }
          & (Join-Path $SmokeBuild "$env:BUILD_TYPE/libnode_windows_cmake_smoke.exe")
          if ($LASTEXITCODE -ne 0) { throw "CMake smoke executable failed" }

      - name: Upload Windows package with symbols
        if: ${{ env.BUILD_TYPE == 'Release' }}
        uses: actions/upload-artifact@v6
        with:
          name: libnode-windows-symbols
          path: source/build/windows
          if-no-files-found: error
          retention-days: 2

      - name: Remove Windows symbols
        if: ${{ env.BUILD_TYPE == 'Release' }}
        working-directory: source
        shell: pwsh
        run: Remove-Item -Path build/windows/x64/symbols -Recurse -Force

      - name: Upload Windows package
        uses: actions/upload-artifact@v6
        with:
          name: libnode-windows
          path: source/build/windows
          if-no-files-found: error
          retention-days: 2

  package:
    name: Package
    if: >-
      ${{
        always() &&
        needs.macos.result == 'success' &&
        needs.ios.result == 'success' &&
        needs.android.result == 'success' &&
        needs.linux.result == 'success' &&
        needs.windows.result == 'success' &&
        (
          needs.ohos.result == 'success' ||
          (inputs.build_type == 'Debug' && needs.ohos.result == 'skipped')
        )
      }}
    runs-on: ubuntu-latest
    needs:
      - macos
      - ios
      - android
      - ohos
      - linux
      - windows
    steps:
      - *checkout-source

      - name: Download platform packages
        uses: actions/download-artifact@v7
        with:
          pattern: libnode-*
          path: package-artifacts

      - name: Rebuild build tree
        run: |
          mkdir -p build/include
          mv package-artifacts/libnode-macos build/macos
          mv package-artifacts/libnode-ios build/ios
          mv package-artifacts/libnode-android build/android
          mv package-artifacts/libnode-linux build/linux
          mv package-artifacts/libnode-windows build/windows
          if [ "${BUILD_TYPE}" = "Release" ]; then
            mv package-artifacts/libnode-ohos build/ohos
          elif [ -e package-artifacts/libnode-ohos ]; then
            echo "Debug package must not contain a HarmonyOS artifact." >&2
            exit 1
          fi

          node_commits="$(find build -type f -name node-commit.txt -print0 \
            | xargs -0 cat \
            | tr -d '\r' \
            | sed '/^$/d' \
            | sort -u)"
          node_commit_count="$(printf '%s\n' "${node_commits}" | sed '/^$/d' | wc -l)"
          if [ "${node_commit_count}" -ne 1 ]; then
            echo "Platform artifacts were not built from one Node.js commit:" >&2
            printf '%s\n' "${node_commits}" >&2
            exit 1
          fi
          node_commit="$(printf '%s\n' "${node_commits}" | head -n 1)"
          find build -type f -name node-commit.txt -delete

          INCLUDE_DIR="$(find build -path '*/include/node_api.h' -print -quit)"
          if [ -z "${INCLUDE_DIR}" ]; then
            echo "No Node.js include directory found in platform artifacts" >&2
            exit 1
          fi
          INCLUDE_DIR="$(dirname "${INCLUDE_DIR}")"
          rsync -a --include='*/' --include='*.h' --exclude='*' "${INCLUDE_DIR}/" build/include/
          find build -mindepth 3 -type d -name include -prune -exec rm -rf {} +
          cp source/patch/windows/bundle-libnode.props build/windows/x64/libnode.props
          cp source/patch/windows/bundle-libnode.cmake build/windows/x64/libnode.cmake
          if [ "${BUILD_TYPE}" = "Debug" ]; then
            cp source/patch/windows/bundle-libnode-debug.props build/windows/x64/libnode.props
            cp source/patch/windows/bundle-libnode-debug.cmake build/windows/x64/libnode.cmake
          fi
          mkdir -p package-upload
          mv build package-upload/libnode

          source_commit="$(git -C source rev-parse HEAD)"
          platforms='["android","ios","linux","macos","windows"]'
          if [ "${BUILD_TYPE}" = "Release" ]; then
            platforms='["android","ios","linux","macos","ohos","windows"]'
          fi
          jq -n \
            --arg source_repository "${SOURCE_REPOSITORY}" \
            --arg source_ref "${SOURCE_REF}" \
            --arg source_commit "${source_commit}" \
            --arg node_ref "${NODE_BRANCH}" \
            --arg node_commit "${node_commit}" \
            --arg build_type "${BUILD_TYPE}" \
            --arg debug_info "${DEBUG_INFO}" \
            --argjson platforms "${platforms}" \
            --arg workflow_repository "${GITHUB_REPOSITORY}" \
            --arg workflow_commit "${GITHUB_SHA}" \
            '{
              source_repository: $source_repository,
              source_ref: $source_ref,
              source_commit: $source_commit,
              node_ref: $node_ref,
              node_commit: $node_commit,
              build_type: $build_type,
              debug_info: $debug_info,
              platforms: $platforms,
              workflow_repository: $workflow_repository,
              workflow_commit: $workflow_commit
            }' > package-upload/libnode/BUILD-METADATA.json

      - name: Validate runtime-only package
        run: |
          expected_platforms='["android","ios","linux","macos","windows"]'
          if [ "${BUILD_TYPE}" = "Release" ]; then
            bash source/shell/validate-libnode-package.sh package-upload/libnode
            expected_platforms='["android","ios","linux","macos","ohos","windows"]'
          else
            bash source/shell/validate-libnode-package.sh --without-ohos package-upload/libnode
          fi
          test "$(jq -er '.build_type' package-upload/libnode/BUILD-METADATA.json)" = "${BUILD_TYPE}"
          test "$(jq -er '.debug_info' package-upload/libnode/BUILD-METADATA.json)" = "${DEBUG_INFO}"
          test "$(jq -cer '.platforms' package-upload/libnode/BUILD-METADATA.json)" = "${expected_platforms}"

      - name: Upload all-platforms package
        uses: actions/upload-artifact@v6
        with:
          name: ${{ env.PACKAGE_ARTIFACT_NAME }}
          path: package-upload
          if-no-files-found: error
          retention-days: 2
