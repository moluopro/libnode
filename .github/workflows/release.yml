name: Release libnode

on:
  workflow_dispatch:
    inputs:
      build_run_id:
        description: Successful Release Build libnode run id to package.
        required: true
      debug_build_run_id:
        description: Successful Debug Build libnode run id to package.
        required: true
      web_build_run_id:
        description: Separate successful Web build run, required when the Release run predates Web support.
        required: false
      tag:
        description: Release tag to create.
        required: true
        default: 24.21.0
      release_name:
        description: Release title. Defaults to the tag when empty.
        required: false
      artifact_name:
        description: Aggregated Release artifact name from the build workflow.
        required: false
        default: libnode
      debug_artifact_name:
        description: Aggregated Debug artifact name from the build workflow.
        required: false
        default: libnode-debug
      asset_name:
        description: Release configuration asset name.
        required: false
        default: libnode.zip
      debug_asset_name:
        description: Debug configuration asset name.
        required: false
        default: libnode-debug.zip
      replace_existing:
        description: Delete an existing release/tag before creating this release.
        required: false
        type: boolean
        default: false

permissions:
  actions: read
  contents: write

run-name: Release ${{ inputs.tag }} from builds ${{ inputs.build_run_id }} and ${{ inputs.debug_build_run_id }}

jobs:
  release:
    name: Package and release
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
      BUILD_RUN_ID: ${{ inputs.build_run_id }}
      DEBUG_BUILD_RUN_ID: ${{ inputs.debug_build_run_id }}
      WEB_BUILD_RUN_ID: ${{ inputs.web_build_run_id }}
      TAG: ${{ inputs.tag }}
      RELEASE_NAME: ${{ inputs.release_name }}
      ARTIFACT_NAME: ${{ inputs.artifact_name }}
      DEBUG_ARTIFACT_NAME: ${{ inputs.debug_artifact_name }}
      ASSET_NAME: ${{ inputs.asset_name }}
      DEBUG_ASSET_NAME: ${{ inputs.debug_asset_name }}
      REPLACE_EXISTING: ${{ inputs.replace_existing }}
    steps:
      - name: Validate build run
        run: |
          set -euo pipefail

          read_run() {
            local run_id="$1"
            local label="$2"
            local run_info
            local run_status
            local run_conclusion
            local run_head_sha
            local run_url

            run_info="$(gh run view "${run_id}" \
              --repo "${GITHUB_REPOSITORY}" \
              --json status,conclusion,headSha,url \
              --jq '[.status, .conclusion, .headSha, .url] | @tsv')"
            IFS=$'\t' read -r run_status run_conclusion run_head_sha run_url <<< "${run_info}"

            if [ "${run_status}" != "completed" ] || [ "${run_conclusion}" != "success" ]; then
              echo "${label} build run ${run_id} is ${run_status}/${run_conclusion}, expected completed/success." >&2
              exit 1
            fi

            printf '%s\t%s\n' "${run_head_sha}" "${run_url}"
          }

          IFS=$'\t' read -r run_head_sha run_url < <(read_run "${BUILD_RUN_ID}" "Release")
          IFS=$'\t' read -r debug_run_head_sha debug_run_url < <(read_run "${DEBUG_BUILD_RUN_ID}" "Debug")
          if [ "${run_head_sha}" != "${debug_run_head_sha}" ]; then
            echo "Release and Debug builds used different workflow commits:" >&2
            echo "  Release: ${run_head_sha}" >&2
            echo "  Debug:   ${debug_run_head_sha}" >&2
            exit 1
          fi

          {
            echo "BUILD_HEAD_SHA=${run_head_sha}"
            echo "BUILD_RUN_URL=${run_url}"
            echo "DEBUG_BUILD_RUN_URL=${debug_run_url}"
          } >> "${GITHUB_ENV}"

      - name: Download aggregated artifacts
        run: |
          set -euo pipefail

          mkdir -p package-release package-debug
          gh run download "${BUILD_RUN_ID}" \
            --repo "${GITHUB_REPOSITORY}" \
            --name "${ARTIFACT_NAME}" \
            --dir package-release
          gh run download "${DEBUG_BUILD_RUN_ID}" \
            --repo "${GITHUB_REPOSITORY}" \
            --name "${DEBUG_ARTIFACT_NAME}" \
            --dir package-debug

      - name: Validate package trees
        run: |
          set -euo pipefail

          validate_tree() {
            local package_root="$1"
            local artifact_name="$2"
            local expected_build_type="$3"
            local expected_debug_info="$4"
            local expect_ohos="$5"
            local expected_platforms="$6"
            local expect_windows_debug_source="$7"
            local required_files=(
              "${package_root}/android/arm64/libnode.a"
              "${package_root}/ios/arm64/libnode.a"
              "${package_root}/linux/x64/libnode.a"
              "${package_root}/macos/arm64/libnode.a"
              "${package_root}/windows/x64/libnode.lib"
              "${package_root}/windows/x64/libnode.props"
              "${package_root}/windows/x64/libnode.cmake"
              "${package_root}/include/node_api.h"
              "${package_root}/include/config.gypi"
              "${package_root}/ICU-PROFILE.json"
              "${package_root}/BUILD-METADATA.json"
            )
            if [ "${expect_ohos}" = "true" ]; then
              required_files+=("${package_root}/ohos/arm64/libnode.a")
            elif [ -e "${package_root}/ohos" ]; then
              echo "Debug package must not contain HarmonyOS files." >&2
              exit 1
            fi

            if [ ! -d "${package_root}" ]; then
              echo "Expected ${package_root} from artifact ${artifact_name}." >&2
              exit 1
            fi
            for file in "${required_files[@]}"; do
              if [ ! -f "${file}" ]; then
                echo "Missing expected package file: ${file}" >&2
                exit 1
              fi
            done
            if find "${package_root}" -path '*/symbols/*' -print -quit | grep -q .; then
              echo "${expected_build_type} package must not include a symbols directory." >&2
              exit 1
            fi
            windows_debug_source="${package_root}/windows/x64/source"
            if [ "${expect_windows_debug_source}" = "true" ]; then
              debug_source_metadata="${windows_debug_source}/SOURCE-METADATA.json"
              debug_node_source="${windows_debug_source}/node"
              debug_source_files=(
                "${debug_source_metadata}"
                "${debug_node_source}/src/node.cc"
                "${debug_node_source}/deps/v8/src/init/v8.cc"
                "${debug_node_source}/deps/uv/src/win/core.c"
              )
              for file in "${debug_source_files[@]}"; do
                if [ ! -f "${file}" ]; then
                  echo "Missing Windows Debug source file: ${file}" >&2
                  exit 1
                fi
              done
              actual_source_file_count="$(find "${debug_node_source}" -type f | wc -l | tr -d ' ')"
              metadata_source_file_count="$(jq -er '.source_file_count' "${debug_source_metadata}")"
              if [ "${actual_source_file_count}" != "${metadata_source_file_count}" ] ||
                 [ "${actual_source_file_count}" -lt 10000 ]; then
                echo "Windows Debug source bundle is incomplete or does not match its metadata." >&2
                exit 1
              fi
              if ! find "${debug_node_source}/out/Debug" \
                -type f \( -name '*.c' -o -name '*.cc' -o -name '*.cpp' -o -name '*.cxx' \) \
                -print -quit | grep -q .; then
                echo "Windows Debug source bundle does not contain generated sources." >&2
                exit 1
              fi
              debug_source_root="$(jq -er '.debug_source.root' "${package_root}/BUILD-METADATA.json")"
              if [ "${debug_source_root}" != "windows/x64/source/node" ]; then
                echo "Debug package has unexpected source metadata." >&2
                exit 1
              fi
              debug_source_node_commit="$(jq -er '.node_commit' "${debug_source_metadata}")"
              package_node_commit="$(jq -er '.node_commit' "${package_root}/BUILD-METADATA.json")"
              if [ "${debug_source_node_commit}" != "${package_node_commit}" ]; then
                echo "Windows Debug source and package Node.js commits differ." >&2
                exit 1
              fi
            elif [ -e "${windows_debug_source}" ]; then
              echo "${expected_build_type} package must not contain Windows Debug sources." >&2
              exit 1
            elif [ "$(jq -cer '.debug_source' "${package_root}/BUILD-METADATA.json")" != "null" ]; then
              echo "${expected_build_type} package has unexpected Debug source metadata." >&2
              exit 1
            fi
            if [ "$(jq -er '.build_type' "${package_root}/BUILD-METADATA.json")" != "${expected_build_type}" ]; then
              echo "Artifact ${artifact_name} is not a ${expected_build_type} package." >&2
              exit 1
            fi
            if [ "$(jq -er '.debug_info' "${package_root}/BUILD-METADATA.json")" != "${expected_debug_info}" ]; then
              echo "Artifact ${artifact_name} has unexpected debug information metadata." >&2
              exit 1
            fi
            if [ "$(jq -er '.icu_profile' "${package_root}/BUILD-METADATA.json")" != "selected-locales-full-break-v1" ]; then
              echo "Artifact ${artifact_name} has an unexpected ICU profile." >&2
              exit 1
            fi
            if jq -e '
              (.trees.brkitr? // null) != null or
              (.trees.brkfiles? // null) != null or
              (.trees.brkdict? // null) != null or
              (.remove // [] | index("brkitr/root.res")) != null
            ' "${package_root}/ICU-PROFILE.json" >/dev/null; then
              echo "Artifact ${artifact_name} prunes required ICU break-iterator data." >&2
              exit 1
            fi
            if [ "$(jq -cer '.platforms' "${package_root}/BUILD-METADATA.json")" != "${expected_platforms}" ]; then
              echo "Artifact ${artifact_name} has an unexpected platform set." >&2
              exit 1
            fi
          }

          release_root="package-release/libnode"
          debug_root="package-debug/libnode"
          validate_tree \
            "${release_root}" \
            "${ARTIFACT_NAME}" \
            "Release" \
            "stripped" \
            "true" \
            '["android","ios","linux","macos","ohos","windows"]' \
            "false"
          validate_tree \
            "${debug_root}" \
            "${DEBUG_ARTIFACT_NAME}" \
            "Debug" \
            "embedded-full-windows-compact-non-windows" \
            "false" \
            '["android","ios","linux","macos","windows"]' \
            "true"

          metadata_keys=(
            source_repository
            source_ref
            source_commit
            node_ref
            node_commit
            icu_profile
            workflow_repository
            workflow_commit
          )
          for key in "${metadata_keys[@]}"; do
            release_value="$(jq -er --arg key "${key}" '.[$key]' "${release_root}/BUILD-METADATA.json")"
            debug_value="$(jq -er --arg key "${key}" '.[$key]' "${debug_root}/BUILD-METADATA.json")"
            if [ "${release_value}" != "${debug_value}" ]; then
              echo "Release and Debug metadata differ for ${key}:" >&2
              echo "  Release: ${release_value}" >&2
              echo "  Debug:   ${debug_value}" >&2
              exit 1
            fi
          done

          source_repository="$(jq -er '.source_repository' "${release_root}/BUILD-METADATA.json")"
          source_commit="$(jq -er '.source_commit' "${release_root}/BUILD-METADATA.json")"
          node_ref="$(jq -er '.node_ref' "${release_root}/BUILD-METADATA.json")"
          node_commit="$(jq -er '.node_commit' "${release_root}/BUILD-METADATA.json")"
          workflow_commit="$(jq -er '.workflow_commit' "${release_root}/BUILD-METADATA.json")"
          if [ "${workflow_commit}" != "${BUILD_HEAD_SHA}" ]; then
            echo "Package workflow commit ${workflow_commit} does not match build run ${BUILD_HEAD_SHA}." >&2
            exit 1
          fi
          {
            echo "SOURCE_REPOSITORY=${source_repository}"
            echo "SOURCE_COMMIT=${source_commit}"
            echo "NODE_REF=${node_ref}"
            echo "NODE_COMMIT=${node_commit}"
          } >> "${GITHUB_ENV}"

      - name: Create release archives
        run: |
          set -euo pipefail

          asset_path="${RUNNER_TEMP}/${ASSET_NAME}"
          debug_asset_path="${RUNNER_TEMP}/${DEBUG_ASSET_NAME}"
          release_tree="${RUNNER_TEMP}/release-tree.txt"
          debug_tree="${RUNNER_TEMP}/debug-tree.txt"
          find package-release/libnode -printf '%P\n' \
            | sed '\|^ohos$|d; \|^ohos/|d' \
            | LC_ALL=C sort > "${release_tree}"
          find package-debug/libnode -printf '%P\n' \
            | sed '\|^windows/x64/source$|d; \|^windows/x64/source/|d' \
            | LC_ALL=C sort > "${debug_tree}"
          if ! diff -u "${release_tree}" "${debug_tree}"; then
            echo "Release and Debug package paths differ outside the intentional HarmonyOS and Windows Debug source trees." >&2
            exit 1
          fi

          rm -f "${asset_path}" "${debug_asset_path}"
          (
            cd package-release
            zip -7qry "${asset_path}" libnode
          )
          (
            cd package-debug
            zip -7qry "${debug_asset_path}" libnode
          )

          max_asset_bytes=2147483648
          asset_size="$(stat -c '%s' "${asset_path}")"
          debug_asset_size="$(stat -c '%s' "${debug_asset_path}")"
          check_asset_size() {
            local asset_name="$1"
            local asset_bytes="$2"
            if [ "${asset_bytes}" -ge "${max_asset_bytes}" ]; then
              echo "${asset_name} is ${asset_bytes} bytes; GitHub Release assets must be under 2 GiB." >&2
              exit 1
            fi
          }
          check_asset_size "${ASSET_NAME}" "${asset_size}"
          check_asset_size "${DEBUG_ASSET_NAME}" "${debug_asset_size}"

          sha256="$(sha256sum "${asset_path}" | awk '{print $1}')"
          debug_sha256="$(sha256sum "${debug_asset_path}" | awk '{print $1}')"
          {
            echo "ASSET_PATH=${asset_path}"
            echo "ASSET_SHA256=${sha256}"
            echo "ASSET_SIZE=${asset_size}"
            echo "DEBUG_ASSET_PATH=${debug_asset_path}"
            echo "DEBUG_ASSET_SHA256=${debug_sha256}"
            echo "DEBUG_ASSET_SIZE=${debug_asset_size}"
          } >> "${GITHUB_ENV}"

          unzip -Z1 "${asset_path}" | sed -n '1,40p'
          test "$(unzip -Z1 "${asset_path}" | sed -n '1p')" = "libnode/"
          unzip -Z1 "${debug_asset_path}" | sed -n '1,40p'
          test "$(unzip -Z1 "${debug_asset_path}" | sed -n '1p')" = "libnode/"

      - name: Validate and download separate Web build
        if: ${{ inputs.web_build_run_id != '' }}
        run: |
          set -euo pipefail
          info="$(gh run view "$WEB_BUILD_RUN_ID" --repo "$GITHUB_REPOSITORY" --json status,conclusion,headSha,url,workflowName)"
          test "$(jq -r '.status' <<< "$info")" = completed
          test "$(jq -r '.conclusion' <<< "$info")" = success
          test "$(jq -r '.workflowName' <<< "$info")" = 'Build Web libnode-lite and libv8'
          web_head="$(jq -r '.headSha' <<< "$info")"
          gh run download "$WEB_BUILD_RUN_ID" --repo "$GITHUB_REPOSITORY" --name libnode-web-profiles --dir package-web
          lite_metadata=package-web/libnode-lite/libnode/web/wasm32/LIBRARY-PROFILE.json
          v8_metadata=package-web/libv8/libv8/web/wasm32/LIBRARY-PROFILE.json
          for metadata in "$lite_metadata" "$v8_metadata"; do
            test "$(jq -er '.workflow_commit' "$metadata")" = "$web_head"
            test "$(jq -er '.node_commit' "$metadata")" = "$NODE_COMMIT"
          done
          web_source="$(jq -er '.source_commit' "$lite_metadata")"
          test "$(jq -er '.source_commit' "$v8_metadata")" = "$web_source"
          [[ "$web_source" =~ ^[0-9a-f]{40}$ ]]
          {
            echo "WEB_BUILD_HEAD_SHA=$web_head"
            echo "WEB_BUILD_SOURCE_COMMIT=$web_source"
            echo "WEB_BUILD_RUN_URL=$(jq -r '.url' <<< "$info")"
          } >> "$GITHUB_ENV"

      - name: Checkout Web packaging helper
        if: ${{ inputs.web_build_run_id != '' }}
        uses: actions/checkout@v6
        with:
          repository: moluopro/nodejs
          ref: ${{ env.WEB_BUILD_SOURCE_COMMIT }}
          token: ${{ secrets.MY_KEY || vars.MY_KEY }}
          path: web-tools
          fetch-depth: 1

      - name: Download and validate Lite and V8 packages
        run: |
          set -euo pipefail
          for profile in libnode-lite libv8; do
            root=libnode
            if [ "$profile" = libv8 ]; then root=libv8; fi
            gh run download "$BUILD_RUN_ID" --repo "$GITHUB_REPOSITORY" --name "$profile" --dir "package-$profile"
            metadata="package-$profile/$root/BUILD-METADATA.json"
            test "$(jq -er '.profile' "$metadata")" = "$profile"
            test "$(jq -er '.node_ref' "$metadata")" = "$NODE_REF"
            test "$(jq -er '.node_commit' "$metadata")" = "$NODE_COMMIT"
            test "$(jq -er '.source_commit' "$metadata")" = "$SOURCE_COMMIT"
            test "$(jq -er '.workflow_commit' "$metadata")" = "$BUILD_HEAD_SHA"
            if [ "$(jq -r '.web_export' "$metadata")" != true ]; then
              if [ -z "$WEB_BUILD_RUN_ID" ]; then
                echo "$profile is missing Web targets; provide a successful Web build run." >&2
                exit 1
              fi
              python3 web-tools/shell/merge-web-profiles.py \
                "package-$profile/$root" "package-web/$profile/$root" \
                "$profile" "$NODE_COMMIT" "$WEB_BUILD_HEAD_SHA"
            fi
            test -s "package-$profile/$root/web/wasm32/$root.a"
            test -f "package-$profile/$root/web/wasm32/include/v8.h"
            (cd "package-$profile" && zip -7qry "$RUNNER_TEMP/$profile.zip" "$root")
            test "$(stat -c '%s' "$RUNNER_TEMP/$profile.zip")" -lt 2147483648
          done
          {
            echo "LITE_ASSET_SHA256=$(sha256sum "$RUNNER_TEMP/libnode-lite.zip" | awk '{print $1}')"
            echo "V8_ASSET_SHA256=$(sha256sum "$RUNNER_TEMP/libv8.zip" | awk '{print $1}')"
          } >> "$GITHUB_ENV"

      - name: Remove existing release
        if: ${{ inputs.replace_existing }}
        env:
          GH_TOKEN: ${{ secrets.MY_KEY || vars.MY_KEY || github.token }}
        run: |
          set -euo pipefail

          if gh release view "${TAG}" --repo "${GITHUB_REPOSITORY}" >/dev/null 2>&1; then
            gh release delete "${TAG}" \
              --repo "${GITHUB_REPOSITORY}" \
              --yes \
              --cleanup-tag
          elif gh api "repos/${GITHUB_REPOSITORY}/git/ref/tags/${TAG}" >/dev/null 2>&1; then
            gh api --method DELETE "repos/${GITHUB_REPOSITORY}/git/refs/tags/${TAG}"
          fi

      - name: Check release does not already exist
        if: ${{ inputs.replace_existing != true }}
        run: |
          set -euo pipefail

          if gh release view "${TAG}" --repo "${GITHUB_REPOSITORY}" >/dev/null 2>&1; then
            echo "Release ${TAG} already exists. Re-run with replace_existing=true to overwrite it." >&2
            exit 1
          fi

          if gh api "repos/${GITHUB_REPOSITORY}/git/ref/tags/${TAG}" >/dev/null 2>&1; then
            echo "Tag ${TAG} already exists without a release. Re-run with replace_existing=true to overwrite it." >&2
            exit 1
          fi

      - name: Create GitHub release
        # A release can tag an earlier build workflow commit. Use the repository
        # token for this mutation; the integration token may reject that tag.
        env:
          GH_TOKEN: ${{ secrets.MY_KEY || vars.MY_KEY || github.token }}
        run: |
          set -euo pipefail

          title="${RELEASE_NAME:-${TAG}}"
          notes_file="${RUNNER_TEMP}/release-notes.md"
          cat > "${notes_file}" <<EOF
          Release build run: ${BUILD_RUN_URL}
          Debug build run: ${DEBUG_BUILD_RUN_URL}
          Build workflow commit: ${BUILD_HEAD_SHA}
          Packaging source: ${SOURCE_REPOSITORY}@${SOURCE_COMMIT}
          Node.js source: nodejs/node@${NODE_COMMIT} (${NODE_REF})
          Debug information: embedded full /Z7 on Windows; compact -g1 DWARF on non-Windows.
          Debug platforms: Android, iOS, Linux, macOS, and Windows. HarmonyOS is Release-only.
          libnode-lite.zip retains Node Environment and N-API compatibility with ICU, OpenSSL, Inspector, SQLite and the V8 WebAssembly API disabled, with V8 Lite defaulting to jitless execution.
          libv8.zip contains standalone V8 Lite and its dependencies without Node or libuv.
          libnode-lite.zip and libv8.zip include pthread-enabled wasm32 Web targets built with Emscripten 5.0.7. V8 uses the ARM simulator and jitless mode; the JavaScript WebAssembly API remains disabled.
          Web build run: ${WEB_BUILD_RUN_URL:-${BUILD_RUN_URL}}
          Web packaging source: ${WEB_BUILD_SOURCE_COMMIT:-${SOURCE_COMMIT}}
          When Web was built separately, package metadata retains the actual native and Web source/workflow commits for each target.

          Asset SHA256:

          \`\`\`
          ${ASSET_SHA256}  ${ASSET_NAME}
          ${DEBUG_ASSET_SHA256}  ${DEBUG_ASSET_NAME}
          ${LITE_ASSET_SHA256}  libnode-lite.zip
          ${V8_ASSET_SHA256}  libv8.zip
          \`\`\`

          Asset size:

          \`\`\`
          ${ASSET_SIZE}  ${ASSET_NAME}
          ${DEBUG_ASSET_SIZE}  ${DEBUG_ASSET_NAME}
          \`\`\`
          EOF

          gh release create "${TAG}" "${ASSET_PATH}" "${DEBUG_ASSET_PATH}" "$RUNNER_TEMP/libnode-lite.zip" "$RUNNER_TEMP/libv8.zip" \
            --repo "${GITHUB_REPOSITORY}" \
            --target "${BUILD_HEAD_SHA}" \
            --title "${title}" \
            --notes-file "${notes_file}"
